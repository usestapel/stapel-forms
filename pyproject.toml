[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-forms"
version = "0.6.1"
description = "Admin-defined forms, anonymous submissions and response review for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "forms", "surveys"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # Floor 0.47.0: `require_capability` gained its third answer —
    # `WorkspaceLookupUnavailable` for "the question could not be asked",
    # distinct from `None` for "the service said no" — which is what makes
    # the `unavailable` -> 503 branch in `authz.authorize` fire. On 0.45/0.46
    # it could not, so a workspaces outage rendered 403 and this module had
    # to publish that conflation as a caveat inside its own contract. The
    # floor is what deletes the caveat: a consumer that reads
    # `capabilities[].gates.behavior` from 0.4.0 and runs an older core would
    # be told 403 means "not granted" while an outage says exactly that.
    # `authz` also passes `strict=True` explicitly, a keyword that does not
    # exist below 0.47.0, so the skew is a TypeError rather than a silent
    # untruth. 0.45.0 remains the reason the views derive from the canonical
    # `stapel_core.django.api.views.StapelAPIView` (0.37.0) and the capability
    # projection subclasses `PermissionAwareAutoSchema` — both hard imports at
    # module load. 0.31.0 remains the reason the resend path can address a
    # telegram chat directly (`request_notification(telegram_chat_id=...)`),
    # and 0.26 supplied docs/errors.json's `owner` field the drift gate needs.
    "stapel-core>=0.47.0,<1.0",
    # The one extra runtime dependency (spec §9): the schema of a form IS a
    # list of stapel-attributes FeatureDefs, and submissions are validated
    # and normalized by its pipeline. An L1 library, imported directly —
    # not a Django app, nothing to add to INSTALLED_APPS.
    #
    # Floor 0.4.6: `StringConfig.multiline` is the textarea-vs-input hint the
    # `/field-kinds` catalogue publishes and the React pair's `string` widget
    # reads. On 0.4.5 the key does not exist, so a form authored with it would
    # be refused by this module's own unknown-config-key gate — a red publish,
    # not a graceful degrade. 0.4.6 also added `FeatureValidationResult.
    # warnings` (see MODULE.md §5 on why nothing here surfaces them).
    "stapel-attributes>=0.4.6,<1.0",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-forms"
Repository = "https://github.com/usestapel/stapel-forms"
Documentation = "https://github.com/usestapel/stapel-forms#readme"
Changelog = "https://github.com/usestapel/stapel-forms/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-forms/issues"

[project.optional-dependencies]
all = []

[tool.setuptools]
package-dir = {"stapel_forms" = "."}
packages = [
    "stapel_forms",
    "stapel_forms.migrations",
    "stapel_forms.management",
    "stapel_forms.management.commands",
]

[tool.setuptools.package-data]
# The contract documents ship IN THE WHEEL — that is what makes
# `stapel-catalog --from-installed` work off the lockfile instead of off
# somebody's discipline. Both stapel-docs packaging gotchas are fixed here
# by construction (spec §1): docs/schema.json IS listed, and the
# translations/ catalogues listed below are real files in the tree.
# `translations/.state.json` needs its own entry — a leading dot is not
# matched by `translations/*.json`.
stapel_forms = [
    "py.typed",
    "docs/schema.json",
    "docs/flows.json",
    "docs/errors.json",
    "docs/capabilities.json",
    "docs/llms.txt",
    "CONFIG.MD",
    "migrations/*.py",
    "schemas/**/*.json",
    "translations/*.json",
    "translations/.state.json",
    # The admin surface (0.6.0). Django finds these through APP_DIRS /
    # AppDirectoriesFinder, i.e. by walking the INSTALLED package — so a
    # wheel that omits them installs an admin that raises
    # TemplateDoesNotExist on first use, and does so only in a real
    # deployment, never in a source checkout where the files are on disk
    # anyway. `tests/test_packaging.py` is the gate that this list stays
    # complete.
    "templates/admin/forms/*.html",
    "static/stapel_forms/*.js",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
